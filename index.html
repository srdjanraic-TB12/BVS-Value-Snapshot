// Exec-tight narrative: lead with the SO WHAT (outcome), then the mechanism.
// Narrative engine: consistent voice ("For [Name], Samsara..."), outcome-first, no redundancy.
function generateNarrative(fd) {
  const dk = fd.valueDrivers[0] === "Reduce Risk" ? "risk"
    : fd.valueDrivers[0] === "Increase Efficiency" ? "efficiency" : "transform";
  const n = fd.customerName, s = fd.fleetSize, ha = fd.assetSize > 0, p = fd.products;
  const assetRef = ha ? ` and ${fd.assetSize} assets` : "";
  let base = "";
  let covered = [];
  if (dk === "risk") {
    if (p.includes("cm34_aim4")) { base = `For ${n}, Samsara can cut accident frequency, liability claims, and insurance exposure across the ${s}-vehicle fleet${assetRef}. AI dual-facing cameras with 360° coverage flag risky behaviors in real time and capture exoneration footage when incidents do occur.`; covered = ["accident_liability","driver_behavior"]; }
    else if (p.includes("cm34")) { base = `For ${n}, Samsara can lower preventable accidents and reduce liability costs across the ${s}-vehicle fleet${assetRef}. AI dual-facing cameras coach drivers in the moment and provide video evidence that protects against false claims.`; covered = ["accident_liability","driver_behavior"]; }
    else if (p.includes("cm33")) { base = `For ${n}, Samsara can reduce at-fault crashes and accelerate claim resolution across the ${s}-vehicle fleet. Forward-facing AI cameras detect collision risk early and supply exoneration footage when an incident occurs.`; covered = ["accident_liability"]; }
    else if (p.includes("vg")) { base = `For ${n}, Samsara can lower speeding incidents and harsh-event rates across the ${s}-vehicle fleet. Real-time GPS and telemetry surface the riskiest drivers so supervisors can coach where it matters most.`; covered = ["driver_behavior"]; }
    else { base = `For ${n}, Samsara turns operational data into early warnings across the ${s}-vehicle fleet${assetRef} so risk gets addressed before it becomes a claim.`; covered = ["accident_liability"]; }
  } else if (dk === "efficiency") {
    if (p.includes("vg")) { base = `For ${n}, Samsara can recover fuel and labor costs lost to idling, off-route driving, and unplanned breakdowns. Real-time GPS and engine telemetry expose where the ${s}-vehicle fleet is losing time and money every day.`; covered = ["fuel_waste"]; }
    else if (p.includes("ag53") || p.includes("ag52")) { base = `For ${n}, Samsara can raise equipment utilization and shrink time wasted hunting for assets${ha ? ` across ${fd.assetSize} pieces of equipment` : ""}. Connected monitoring shows where every asset is, how hard it's working, and when it needs service before it fails.`; covered = ["asset_visibility","maintenance_reactive"]; }
    else if (p.includes("cam")) { base = `For ${n}, Samsara can shorten work-order cycles and reduce unplanned downtime across the ${s}-vehicle fleet${assetRef}. A single maintenance platform replaces paper and disconnected systems so issues get caught and closed faster.`; covered = ["maintenance_reactive","manual_processes"]; }
    else { base = `For ${n}, Samsara surfaces fuel, utilization, and uptime gaps across the ${s}-vehicle fleet${assetRef} so small fixes compound into measurable annual savings.`; covered = ["fuel_waste"]; }
  } else {
    if (p.includes("workflows") || p.includes("training")) { base = `For ${n}, Samsara can free supervisors from paperwork and give leadership a real-time view of field operations across the ${s}-vehicle fleet${assetRef}. Digital inspections, training, and reporting replace clipboards and spreadsheets without changing how crews work.`; covered = ["manual_processes","compliance_burden","training_gaps"]; }
    else if (p.includes("cam")) { base = `For ${n}, Samsara can run maintenance as a connected workflow instead of a paper trail. One platform handles fault detection, work orders, and cost tracking so techs spend less time logging and more time fixing.`; covered = ["maintenance_reactive","manual_processes"]; }
    else { base = `For ${n}, Samsara digitizes the workflows the ${s}-vehicle fleet${assetRef} runs on today, giving every stakeholder the same live data from a single platform.`; covered = ["manual_processes"]; }
  }
  const themes = detectThemes(fd.keyChallenge);
  if (themes.length > 0) {
    const newThemes = themes.filter(t => !covered.includes(t)).slice(0, 2);
    const fr = newThemes.map(t => THEME_FRAGMENTS[t]).filter(Boolean);
    if (fr.length === 1) base += ` Beyond this, Samsara also helps ${n} ${fr[0]}.`;
    else if (fr.length >= 2) base += ` Beyond this, Samsara also helps ${n} ${fr[0]} — and ${fr[1]}.`;
  }
  if (fd.valueDrivers.length > 1) {
    const sec = fd.valueDrivers[1];
    if (sec === "Reduce Risk") base += ` The same platform extends to safety outcomes, protecting the workforce on the same data feed.`;
    else if (sec === "Increase Efficiency") base += ` That same data compounds into measurable efficiency gains across the fleet.`;
    else base += ` The workflows that run on top consolidate paper processes into one digital backbone.`;
  }
  return base;
}

function getValueDriverPhrase(drivers) {
  if (!drivers || drivers.length === 0) return "";
  const has = (d) => drivers.includes(d);
  if (drivers.length === 1) {
    if (has("Reduce Risk")) return "accident-related costs and liability exposure";
    if (has("Increase Efficiency")) return "fuel waste and fleet downtime";
    if (has("Digitally Transform")) return "manual workflows and fragmented operational data";
  }
  // Two drivers — order canonicalized: Risk, Efficiency, Digital
  if (has("Reduce Risk") && has("Increase Efficiency")) return "accident exposure and fuel and uptime waste";
  if (has("Reduce Risk") && has("Digitally Transform")) return "accident exposure and manual workflows";
  if (has("Increase Efficiency") && has("Digitally Transform")) return "fuel and uptime waste and manual workflows";
  return "";
}

function getTopBenchmarkSentence(drivers, products) {
  if (!drivers || drivers.length === 0 || !products || products.length === 0) return "";

      : driver === "Increase Efficiency" ? "efficiency" : "transform";
    const bench = BENCHMARKS[dk][products[0]] || BENCHMARKS[dk].default;
    const primary = bench[0];
    const template = BENCHMARK_TEMPLATES[primary.label];
    if (template) return template(primary);

    return `${primary.label.toLowerCase()} of ${primary.industry}${primary.unit} compared to ${primary.samsara}${primary.unit} for Samsara-equipped fleets`;
  });
  return sentences.join(", and ");
}

// ─── Loss attribution: map each product to a high-level loss category ─────
// Per KP's pilot feedback: a City Manager/COO needs to see WHERE the loss
// is concentrated, not just the total number. This drives routing decisions.
const LOSS_CATEGORY_MAP = {
  cm33: "Accident & liability exposure",
  cm34: "Accident & liability exposure",
  cm34_aim4: "Accident & liability exposure",
  vg: "Fuel waste & operational inefficiency",
  at: "Equipment visibility & recovery",
  ag51: "Equipment visibility & recovery",
  ag52: "Equipment underutilization & downtime",
  ag53: "Equipment underutilization & downtime",
  training: "Driver training & retention costs",
  workflows: "Admin time on paper-based processes",
  cam: "Maintenance cost variability",
};

function getLossBreakdown(fd, targetTotal) {
  const buckets = {};
  fd.products.forEach(id => {
    const prod = ALL_PRODUCTS.find(x => x.id === id);
    if (!prod) return;
    const category = LOSS_CATEGORY_MAP[id] || "Other operational losses";
    const multiplier = prod.appliesTo === "fleet" ? fd.fleetSize
      : prod.appliesTo === "asset" ? fd.assetSize
      : fd.fleetSize + fd.assetSize;
    const dollars = prod.avoidCost * multiplier;
    buckets[category] = (buckets[category] || 0) + dollars;
  });
  // Round each to nearest 5K, sort descending
  let entries = Object.entries(buckets)
    .map(([label, amount]) => ({ label, amount: roundTo5K(amount) }))
    .filter(b => b.amount > 0)
    .sort((a, b) => b.amount - a.amount);
  // Reconcile rounding: ensure categories sum to the displayed snapshot total.
  // Absorb any diff into the largest category so the math always adds up.
  if (entries.length > 0 && typeof targetTotal === "number") {
    const sumRounded = entries.reduce((s, e) => s + e.amount, 0);
    const diff = targetTotal - sumRounded;
    if (diff !== 0) entries[0].amount += diff;
  }
  // Keep top 3
  return entries.slice(0, 3);
}

function generateSnapshot(fd) {
  const selected = fd.products.map(id => ALL_PRODUCTS.find(p => p.id === id)).filter(Boolean);
  let tA = 0, tS = 0;
  selected.forEach(p => {
    const m = p.appliesTo === "fleet" ? fd.fleetSize
      : p.appliesTo === "asset" ? fd.assetSize : fd.fleetSize + fd.assetSize;
    tA += p.avoidCost * m; tS += p.savings * m;
  });
  const dk = fd.valueDrivers[0] === "Reduce Risk" ? "risk"
    : fd.valueDrivers[0] === "Increase Efficiency" ? "efficiency" : "transform";
  const eq = EQUIVALENCY[dk];
  const eqNum = Math.round(tS / eq.divisor);
  const eqText = eqNum >= 2 ? "Equivalent to ~" + eqNum + " " + eq.label : "";

  const totalAvoidable = roundTo5K(tA);
  const totalSavings = roundTo5K(tS);
  const benchmarks = BENCHMARKS[dk][fd.products[0]] || BENCHMARKS[dk].default;

  // ─── New pilot email fields ─────────────────────────────────────────────
  const valueDriverPhrase = getValueDriverPhrase(fd.valueDrivers);
  const topBenchmarkSentence = getTopBenchmarkSentence(fd.valueDrivers, fd.products);
  const operationalTranslation = getOperationalTranslation(fd.industry, fd.valueDrivers);
  const lossBreakdown = getLossBreakdown(fd, totalAvoidable);

  // Build narrative and append operational translation as a final sentence,
  // matching the existing Challenge Keyword append pattern.
  let narrative = generateNarrative(fd);
  if (operationalTranslation && totalAvoidable > 0) {
    narrative += ` Recovering ~$${totalAvoidable.toLocaleString()} could help fund ${operationalTranslation}.`;
  }

  // ─── Case study alignment safeguard ───────────────────────────────────────
  // Suppress quote if the case study's published quote doesn't thematically
  // match the value driver. Prevents stat/quote mismatches on the snapshot.
  const rawCaseStudy = CASE_STUDIES[fd.industry][dk];
  const themeAligned = !rawCaseStudy.theme || rawCaseStudy.theme.length === 0
    || rawCaseStudy.theme.includes(dk);
  const caseStudy = themeAligned
    ? rawCaseStudy
    : { ...rawCaseStudy, quote: "" };

  return {
    totalAvoidable,
    totalSavings,
    narrative,
    benchmarks,
    caseStudy,
    industryContext: getContext(fd.industry, fd.customerName),
    custLabels: selected.map(p => p.custLabel),
    equivalency: eqText,
    // Pilot email template fields
    valueDriverPhrase,
    topBenchmarkSentence,
    operationalTranslation,
    lossBreakdown,
  };
}

// ─── EditableText: click-to-edit, yellow when editing ──────────────────────
function EditableText({ value, onChange, multiline = false, style = {}, placeholder }) {
  const [editing, setEditing] = useState(false);
  const [local, setLocal] = useState(value);
  useEffect(() => setLocal(value), [value]);
  if (editing) {
    const b = {
      ...style, background: "#FFFDE7", border: `2px solid ${C.amber}`, borderRadius: 4,
      padding: "4px 8px", outline: "none", width: "100%", fontFamily: "inherit",
      fontSize: "inherit", color: "inherit", lineHeight: "inherit",
      boxSizing: "border-box", resize: "none",
    };
    return multiline
      ? <textarea autoFocus rows={4} value={local} onChange={e => setLocal(e.target.value)}
          onBlur={() => { setEditing(false); onChange(local); }} style={b} />
      : <input autoFocus type="text" value={local} onChange={e => setLocal(e.target.value)}
          onBlur={() => { setEditing(false); onChange(local); }} style={b} />;
  }
  return (
    <div className="no-print-edit" onClick={() => setEditing(true)}
      style={{ ...style, cursor: "pointer", borderRadius: 3, padding: "2px 4px", margin: "0 -4px", transition: "background 0.15s" }}
      onMouseEnter={e => { e.currentTarget.style.background = "rgba(255,253,231,0.6)"; }}
      onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}>
      {local || placeholder}
    </div>
  );
}

const EMPTY_FD = {
  customerName: "", industry: "", fleetSize: 100, assetSize: 0,
  products: [], valueDrivers: [], keyChallenge: "",
  adrName: "", adrEmail: "", adrPhone: "",
  role: "ADR",
};

// ─── Role-based Talking Points Engine ──────────────────────────────────────
// Architecture: ROLE_TEMPLATES maps role names to generator functions.
// Adding a future role = write a new generator + flip null to the function ref + enable checkbox.
// No engine changes required.

function generateADRTalkingPoints(fd, snapshot) {
  const n = fd.customerName, s = fd.fleetSize, ha = fd.assetSize > 0;
  const p = fd.products, dk = fd.valueDrivers[0];
  const totalProducts = p.map(id => {
    const prod = ALL_PRODUCTS.find(x => x.id === id);
    return prod ? prod.label : id;
  }).join(", ");

  // Section 1: How the savings number was built
  // Uses the snapshot-generated benchmark sentence + value driver phrase for consistency
  // with the email templates. The operational translation is the math's "so what."
  const benchmark1 = snapshot.benchmarks[0];
  const benchmark2 = snapshot.benchmarks[1];

  let section1 = `The ~$${snapshot.totalSavings.toLocaleString()} projected savings assumes a ${s}-vehicle fleet${ha ? ` and ${fd.assetSize} assets` : ""} with ${totalProducts}. The math comes from real benchmark gaps: ${snapshot.topBenchmarkSentence}, applied to typical ${fd.industry.toLowerCase()} cost structures targeting ${snapshot.valueDriverPhrase}. It's deliberately conservative — real savings depend on the prospect's current state, which a deeper analysis would surface.`;
  if (snapshot.operationalTranslation && snapshot.totalAvoidable > 0) {
    section1 += ` Bottom line: recovering ~$${snapshot.totalAvoidable.toLocaleString()} could fund ${snapshot.operationalTranslation} — that's the budget-conversation framing.`;
  }

  // Section 2: Talking points (3-5, driver and product-aware)
  const talkingPoints = [];

  if (dk === "Reduce Risk") {
    if (p.includes("cm34") || p.includes("cm34_aim4") || p.includes("cm33")) {
      talkingPoints.push(`${fd.industry} fleets typically see harsh events at ${benchmark1.industry === 70 ? "70" : benchmark1.industry} per 10,000 miles. Samsara customers in similar segments cut that to ${benchmark1.samsara}. That's where most of the safety savings come from.`);
      talkingPoints.push(`The video evidence side often closes deals on its own. One captured incident that exonerates a driver can pay for the whole deployment.`);
      talkingPoints.push(`AI cameras don't just monitor, they coach drivers in real time. Most public sector customers see meaningful behavior change within 60 to 90 days.`);
    } else if (p.includes("vg")) {
      talkingPoints.push(`Speeding sits around ${benchmark1.industry}${benchmark1.unit} of drive time industry-wide. Samsara customers operate at ${benchmark1.samsara}${benchmark1.unit}. That's not just safety, it's wear, insurance, and citizen complaints.`);
      talkingPoints.push(`GPS visibility surfaces the riskiest drivers so supervisors can coach where it matters most. It's not about catching people, it's about closing the loop on behavior.`);
    }
    talkingPoints.push(`Liability costs are the line item most fleet managers can't directly control today. This is the lever that changes that.`);
  } else if (dk === "Increase Efficiency") {
    if (p.includes("vg")) {
      talkingPoints.push(`Public sector fleets average ${benchmark1.industry}${benchmark1.unit} idling time. Samsara customers run at ${benchmark1.samsara}${benchmark1.unit}. On fuel alone that adds up fast for a ${s}-vehicle fleet.`);
      talkingPoints.push(`The ROI usually shows up first in fuel, second in maintenance, third in productivity. All three compound.`);
    }
    if (p.includes("ag52") || p.includes("ag53") || p.includes("ag51") || p.includes("at")) {
      talkingPoints.push(`Asset utilization rates in your segment hover around ${benchmark2 ? benchmark2.industry : 40}${benchmark2 ? benchmark2.unit : "%"}. Samsara customers see ${benchmark2 ? benchmark2.samsara : 65}${benchmark2 ? benchmark2.unit : "%"}. Most fleets don't realize how much idle equipment costs them every month.`);
      talkingPoints.push(`Equipment that sits unused depreciates anyway. Connected monitoring turns that hidden cost into a measurable line item.`);
    }
    talkingPoints.push(`Every percentage point you recover compounds annually. The ~$${snapshot.totalSavings.toLocaleString()} number is year one, not lifetime.`);
  } else {
    talkingPoints.push(`Most ${fd.industry.toLowerCase()} operations still run on paper and spreadsheets. The hidden cost isn't the paper, it's the time your supervisors lose to admin.`);
    talkingPoints.push(`DVIR completion rates in your segment average around ${benchmark1.industry}${benchmark1.unit}. Samsara customers hit ${benchmark1.samsara}${benchmark1.unit}. That's compliance plus liability protection in one move.`);
    talkingPoints.push(`The transformation story isn't about replacing what works, it's about connecting what doesn't talk to each other today.`);
  }

  // Operational translation — the budget-conversation talking point.
  // This is usually the strongest closer for public sector ADRs because it
  // translates abstract savings into a tangible reinvestment story.
  if (snapshot.operationalTranslation && snapshot.totalAvoidable > 0) {
    talkingPoints.unshift(`The ~$${snapshot.totalAvoidable.toLocaleString()} in avoidable cost could fund ${snapshot.operationalTranslation}. That's the budget-conversation framing — lead with this when you're talking to anyone in finance or operations.`);
  }

  // Equivalency talking point — translates savings into outcome units
  if (snapshot.equivalency) {
    talkingPoints.push(`The ~$${snapshot.totalSavings.toLocaleString()} number ${snapshot.equivalency.toLowerCase()}. That makes the abstract concrete on a safety or operations conversation.`);
  }

  // Cap at 5
  const finalTalkingPoints = talkingPoints.slice(0, 5);

  // Section 3: Objections — first objection dynamically references the
  // prospect's actual value driver concern via valueDriverPhrase.
  const vdp = snapshot.valueDriverPhrase || "accident-related costs";
  const objections = [
    {
      objection: "There's no way we save that much.",
      response: `I hear that a lot. The number is conservative on purpose. Real savings depend on how much your team spends on ${vdp} today — happy to walk through the math with whatever data you have on hand.`
    },
    {
      objection: "We already have GPS.",
      response: "Most legacy GPS just shows location on a map. This is operational data, fuel, behavior, asset health, all connected in one platform. Different category of value."
    },
    {
      objection: "We don't have budget for this.",
      response: "Most public sector agencies don't fund this from a new IT line, they fund it from accident liability or fuel reduction. The numbers in this snapshot show exactly why."
    }
  ];

  // Section 4: Follow-up questions
  const followUps = [];
  if (dk === "Reduce Risk") {
    followUps.push("What's your current process for reviewing harsh driving events when they happen?");
    followUps.push("How are accident-related costs tracked in your budget today?");
    followUps.push("Walk me through what happens after a vehicle incident from your team's perspective.");
  } else if (dk === "Increase Efficiency") {
    followUps.push("How are you measuring fleet utilization today, if at all?");
    followUps.push("When was the last time a piece of equipment went missing or wasn't available when crews needed it?");
    followUps.push("Where does most of your fleet operating budget go — fuel, maintenance, labor, or something else?");
  } else {
    followUps.push("How much time does your team spend on DVIRs, inspections, and reporting each week?");
    followUps.push("Walk me through how data moves from the field to the front office today.");
    followUps.push("If you could fix one thing about your fleet operations tomorrow, what would it be?");
  }

  return {
    header: {
      account: fd.customerName,
      segment: fd.industry,
      products: totalProducts,
      challenge: fd.keyChallenge,
      role: "ADR"
    },
    section1: section1,
    section2: finalTalkingPoints,
    section3: objections,
    section4: followUps,
    lossBreakdown: snapshot.lossBreakdown,
    totalAvoidable: snapshot.totalAvoidable,
  };
}

const ROLE_TEMPLATES = {
  ADR: generateADRTalkingPoints,
  AE: null,
  Marketing: null,
  Other: null
};

function generateTalkingPoints(fd, snapshot) {
  const generator = ROLE_TEMPLATES[fd.role];
  if (!generator) return null;
  return generator(fd, snapshot);
}

// ─── Snapshot Tracking (silent Google Forms submission) ─────────────
function trackSnapshot(fd, snapshot, version) {
  try {
    const url = "https://docs.google.com/forms/d/e/1FAIpQLSedPKQsZWxMgQYavf9uBugTQ6yaJKnY9xdQKVcEcwaZw6C9iA/formResponse";
    const params = new URLSearchParams();
    params.append("entry.432669713", fd.customerName);
    params.append("entry.827968877", fd.industry);
    params.append("entry.625600488", String(fd.fleetSize));
    params.append("entry.1542132547", String(fd.assetSize));
    params.append("entry.1520895472", fd.products.map(id => {
      const p = ALL_PRODUCTS.find(x => x.id === id);
      return p ? p.label : id;
    }).join(", "));
    params.append("entry.1509866571", fd.valueDrivers[0] || "");
    params.append("entry.1171657357", fd.keyChallenge);
    params.append("entry.345104235", "$" + snapshot.totalAvoidable.toLocaleString());
    params.append("entry.1954234826", "$" + snapshot.totalSavings.toLocaleString());
    params.append("entry.253695490", fd.adrName);
    params.append("entry.766788548", fd.adrEmail);
    params.append("entry.1625502066", version);
    fetch(url, { method: "POST", mode: "no-cors", body: params });
  } catch(e) { /* silent fail — tracking should never break the app */ }
}

                    border: `2px solid ${C.grayBorder}`, fontSize: 15, fontFamily: "inherit",
                    color: C.navy, height: 120, resize: "none", lineHeight: 1.6 }}
                  onFocus={e => e.target.style.borderColor = C.blue}
                  onBlur={e => e.target.style.borderColor = C.grayBorder} />
              )}
              {screen === 7 && (
                <div>
                  <div style={{ background: C.blueBg, borderRadius: 10, padding: "18px 22px", marginBottom: 16 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "90px 1fr", gap: "8px 14px", fontSize: 13 }}>
                      <span style={{ fontWeight: 700, color: C.gray }}>Customer</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.customerName}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Industry</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.industry}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Fleet</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.fleetSize} vehicles</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Assets</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.assetSize} assets</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Products</span>
                      <span style={{ fontWeight: 600, color: C.navy, lineHeight: 1.5 }}>
                        {fd.products.map(id => {
                          const p = ALL_PRODUCTS.find(x => x.id === id);
                          return p ? p.label + " (" + p.hw + ")" : id;
                        }).join(", ")}
                      </span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Drivers</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.valueDrivers.join(", ")}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Challenge</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.keyChallenge}</span>
                    </div>
                  </div>
                  <p style={{ fontSize: 11, fontWeight: 700, color: C.navy, marginBottom: 10 }}>
                    Your Contact Info (appears on the snapshot)
                  </p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Name *
                      </label>
                      <input type="text" value={fd.adrName}
                        onChange={e => setFd({ ...fd, adrName: e.target.value })}
                        placeholder="Jane Smith"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Email *
                      </label>
                      <input type="email" value={fd.adrEmail}
                        onChange={e => setFd({ ...fd, adrEmail: e.target.value })}
                        placeholder="jane@samsara.com"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                    <div style={{ gridColumn: "1 / 3" }}>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Phone (optional)
                      </label>
                      <input type="tel" value={fd.adrPhone}
                        onChange={e => setFd({ ...fd, adrPhone: e.target.value })}
                        placeholder="(415) 555-0123"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                  </div>

                  {/* ── Your Role section ──────────────────────── */}
                  <div style={{ marginTop: 20, paddingTop: 18, borderTop: "1px solid " + C.grayBorder }}>
                    <p style={{ fontSize: 11, fontWeight: 700, color: C.navy, margin: "0 0 4px 0" }}>
                      Your Role
                    </p>
                    <p style={{ fontSize: 11, color: C.gray, margin: "0 0 12px 0" }}>
                      Select your role to generate a tailored talking points doc alongside your snapshot.
                    </p>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {[
                        { id: "ADR", label: "ADR", active: true },
                        { id: "AE", label: "AE, coming soon", active: false },
                        { id: "Marketing", label: "Marketing, coming soon", active: false },
                        { id: "Other", label: "Other, coming soon", active: false },
                      ].map(r => {
                        const checked = fd.role === r.id;
                        return (
                          <button key={r.id}
                            onClick={() => r.active && setFd({ ...fd, role: r.id })}
                            disabled={!r.active}
                            title={!r.active ? "Available in a future version" : ""}
                            style={{
                              padding: "10px 14px", borderRadius: 8,
                              border: "1.5px solid " + (checked ? C.blue : C.grayBorder),
                              background: checked ? C.blueBg : (r.active ? C.white : "#FAFAFA"),
                              cursor: r.active ? "pointer" : "not-allowed",
                              display: "flex", justifyContent: "space-between", alignItems: "center",
                              fontFamily: "inherit", width: "100%",
                              opacity: r.active ? 1 : 0.5
                            }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: checked ? C.navy : C.dark }}>
                              {r.label}
                            </span>
                            <div style={{
                              width: 18, height: 18, borderRadius: 4,
                              border: "2px solid " + (checked ? C.blue : "#D1D5DB"),
                              background: checked ? C.blue : C.white,
                              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0
                            }}>
                              {checked && <Check size={10} color={C.white} />}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
              marginTop: 28, paddingTop: 18, borderTop: `1px solid ${C.grayBorder}` }}>
              <button onClick={() => screen > 0 && nav(-1)} disabled={screen === 0}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "10px 18px",
                  borderRadius: 8, border: "none",
                  background: screen > 0 ? C.blueBg : "transparent",
                  color: screen > 0 ? C.navy : "transparent",
                  fontSize: 13, fontWeight: 600,
                  cursor: screen > 0 ? "pointer" : "default", fontFamily: "inherit" }}>
                <ChevronLeft size={15} /> Back
              </button>
              {screen < 7
                ? <button onClick={() => canAdvance() && nav(1)} disabled={!canAdvance()}
                    style={{ display: "flex", alignItems: "center", gap: 6,
                      padding: "12px 28px", borderRadius: 8, border: "none",
                      background: canAdvance() ? C.blue : "#CBD5E1", color: "#fff",
                      fontSize: 14, fontWeight: 700,
                      cursor: canAdvance() ? "pointer" : "not-allowed", fontFamily: "inherit" }}>
                    Continue <ChevronRight size={16} />
                  </button>
                : <button onClick={handleGenerate}
                    style={{ display: "flex", alignItems: "center", gap: 6,
                      padding: "13px 32px", borderRadius: 8, border: "none",
                      background: C.blue, color: "#fff", fontSize: 15, fontWeight: 700,
                      cursor: "pointer", fontFamily: "inherit" }}>
                    Generate Snapshot <ChevronRight size={17} />
                  </button>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ─── SNAPSHOT phase ──────────────────────────────────────────────────────
  const downloadSnapshot = () => {
    const t = document.title;
    document.title = fd.customerName.replace(/\s+/g, '_') + '_Samsara Value Snapshot';
    document.body.classList.add('print-snapshot-only');
    window.print();
    document.body.classList.remove('print-snapshot-only');
    document.title = t;
  };
  const downloadTalkingPoints = () => {
    const t = document.title;
    document.title = fd.customerName.replace(/\s+/g, '_') + '_ADR Talking Points';
    document.body.classList.add('print-talking-only');
    window.print();
    document.body.classList.remove('print-talking-only');
    document.title = t;
  };
  return (
    <div style={{ minHeight: "100vh", background: "#C8CED6",
      fontFamily: "'Helvetica Neue',Helvetica,Arial,sans-serif" }}>
      <style>{`
        *{box-sizing:border-box;}
        @media print {
          .no-print, .no-print-edit > * { display: none !important; }
          body, html, #root { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

          /* Snapshot: landscape 11x8.5 */
          .snap { box-shadow: none !important; margin: 0 !important; border-radius: 0 !important;
            width: 11in !important; height: 8.5in !important; page: snapshotPage; }
          @page snapshotPage { size: 11in 8.5in landscape; margin: 0; }

          /* Talking Points: portrait 8.5x11 */
          .talking-page { box-shadow: none !important; margin: 0 !important; border-radius: 0 !important;
            width: 8.5in !important; height: 11in !important; page: talkingPage; }
          @page talkingPage { size: 8.5in 11in portrait; margin: 0; }

          body.print-snapshot-only .talking-page { display: none !important; }
          body.print-talking-only .snapshot-page { display: none !important; }
        }
      `}</style>

      <div className="no-print" style={{ background: C.navy, padding: "10px 20px",
        display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={SAMSARA_LOGO_WHITE} alt="Samsara" style={{ width: 18, height: 18 }} />
          <span style={{ fontSize: 13, fontWeight: 600, color: "rgba(255,255,255,0.7)" }}>
            Value Snapshot Generator
          </span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setPhase("intake"); setScreen(0); }}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 14px",
              borderRadius: 6, border: "1px solid rgba(255,255,255,0.2)",
              background: "transparent", color: "rgba(255,255,255,0.75)",
              fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
            <RotateCcw size={12} /> New Snapshot
          </button>
          <button onClick={downloadSnapshot}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 18px",
              borderRadius: 6, border: "none", background: C.blue, color: "#fff",
              fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
            <Download size={12} /> Download Snapshot
          </button>
          {talkingPoints && (
            <button onClick={downloadTalkingPoints}
              style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 18px",
                borderRadius: 6, border: "1px solid " + C.blue,
                background: "transparent", color: C.blueLight,
                fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              <Download size={12} /> Download Talking Points
            </button>
          )}
        </div>
      </div>
      <div className="no-print" style={{ maxWidth: 1100, margin: "6px auto 4px",
        padding: "0 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <p style={{ fontSize: 11, color: C.gray, fontStyle: "italic", margin: 0 }}>
          Click text to edit · Hover sections to remove · Numbers are locked · Talking Points are internal-only
        </p>
        {Object.keys(hidden).length > 0 && (
          <button onClick={() => setHidden({})}
            style={{ fontSize: 10, color: C.blue, background: "none", border: "none",
              cursor: "pointer", fontWeight: 700, fontFamily: "inherit" }}>
            Restore all
          </button>
        )}
      </div>

      <div className="snapshot-page">
        <SnapshotPage
          fd={fd}
          snapshot={snapshot}
          hidden={hidden}
          desel={desel}
          editNarr={editNarr} setEditNarr={setEditNarr}
          editCtx={editCtx} setEditCtx={setEditCtx}
          editCTA={editCTA} setEditCTA={setEditCTA}
        />
      </div>

      {talkingPoints && (
        <div className="no-print" style={{ maxWidth: 1100, margin: "32px auto 8px",
          padding: "0 12px", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ height: 1, flex: 1, background: "#94A3B8" }} />
          <span style={{ fontSize: 10, fontWeight: 700, color: "#475569",
            letterSpacing: 2, textTransform: "uppercase" }}>
            Internal Companion · {talkingPoints.header.role} Talking Points
          </span>
          <div style={{ height: 1, flex: 1, background: "#94A3B8" }} />
        </div>
      )}

      <TalkingPointsPage fd={fd} talkingPoints={talkingPoints} />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
