    if (p.includes("vg")) base = `${n} can recover fuel and labor costs lost to idling, off-route driving, and unplanned breakdowns. Real-time GPS and engine telemetry expose where ${s} vehicles are losing time and money every day.`;
    else if (p.includes("ag53") || p.includes("ag52")) base = `${n} can raise equipment utilization and shrink time wasted hunting for assets${ha ? ` across your ${fd.assetSize} pieces of equipment` : ""}. Connected monitoring shows where every asset is, how hard it's working, and when it needs service — before it fails.`;
    else if (p.includes("cam")) base = `${n} can shorten work-order cycles and reduce unplanned downtime across your ${s}-vehicle fleet${ha ? ` and ${fd.assetSize} assets` : ""}. A single maintenance platform replaces paper and disconnected systems, so issues get caught and closed faster.`;
    else base = `${n} can convert daily operational waste into measurable budget savings. Samsara surfaces fuel, utilization, and uptime gaps across your ${s}-vehicle fleet${ha ? ` and ${fd.assetSize} assets` : ""} so small fixes compound into real annual returns.`;
  } else {
    if (p.includes("workflows") || p.includes("training")) base = `${n} can free supervisors from paperwork and give leadership a real-time view of field operations across your ${s}-vehicle fleet${ha ? ` and ${fd.assetSize} assets` : ""}. Digital inspections, training, and reporting replace clipboards and spreadsheets — without changing how crews work.`;
    else if (p.includes("cam")) base = `${n} can run maintenance as a connected workflow instead of a paper trail. One platform handles fault detection, work orders, and cost tracking — so techs spend less time logging and more time fixing.`;
    else base = `${n} can replace fragmented systems with one operational source of truth. Samsara digitizes the workflows your ${s}-vehicle fleet${ha ? ` and ${fd.assetSize} assets` : ""} runs on today, giving every stakeholder the same live data.`;
  }
  const themes = detectThemes(fd.keyChallenge);
  if (themes.length > 0) {
    const fr = themes.slice(0, 2).map(t => THEME_FRAGMENTS[t]).filter(Boolean);
    if (fr.length === 1) base += ` Specifically, Samsara can help ${n} ${fr[0]}.`;
    else if (fr.length >= 2) base += ` Specifically, Samsara can help ${n} ${fr[0]} — while also helping ${fr[1]}.`;
  }
  if (fd.valueDrivers.length > 1) {
    const sec = fd.valueDrivers[1];
    if (sec === "Reduce Risk") base += ` The same platform extends to safety outcomes — protecting your workforce on the same data feed.`;
    else if (sec === "Increase Efficiency") base += ` That same telemetry compounds into measurable efficiency gains across the fleet.`;
    else base += ` And the workflows that run on top consolidate paper processes into one digital backbone.`;
  }
  return base;
}

function generateSnapshot(fd) {
  const selected = fd.products.map(id => ALL_PRODUCTS.find(p => p.id === id)).filter(Boolean);
  let tA = 0, tS = 0;
  selected.forEach(p => {
    const m = p.appliesTo === "fleet" ? fd.fleetSize
      : p.appliesTo === "asset" ? fd.assetSize : fd.fleetSize + fd.assetSize;
    tA += p.avoidCost * m; tS += p.savings * m;
  });
  const dk = fd.valueDrivers[0] === "Reduce Risk" ? "risk"
    : fd.valueDrivers[0] === "Increase Efficiency" ? "efficiency" : "transform";
  const eq = EQUIVALENCY[dk];
  const eqNum = Math.round(tS / eq.divisor);
  const eqText = eqNum >= 2 ? "Equivalent to ~" + eqNum + " " + eq.label : "";
  return {
    totalAvoidable: roundTo5K(tA),
    totalSavings: roundTo5K(tS),
    narrative: generateNarrative(fd),
    benchmarks: BENCHMARKS[dk][fd.products[0]] || BENCHMARKS[dk].default,
    caseStudy: CASE_STUDIES[fd.industry][dk],
    industryContext: getContext(fd.industry, fd.customerName),
    custLabels: selected.map(p => p.custLabel),
    equivalency: eqText,
  };
}

// ─── EditableText: click-to-edit, yellow when editing ──────────────────────
function EditableText({ value, onChange, multiline = false, style = {}, placeholder }) {
  const [editing, setEditing] = useState(false);
  const [local, setLocal] = useState(value);
  useEffect(() => setLocal(value), [value]);
  if (editing) {
    const b = {
      ...style, background: "#FFFDE7", border: `2px solid ${C.amber}`, borderRadius: 4,
      padding: "4px 8px", outline: "none", width: "100%", fontFamily: "inherit",
      fontSize: "inherit", color: "inherit", lineHeight: "inherit",
      boxSizing: "border-box", resize: "none",
    };
    return multiline
      ? <textarea autoFocus rows={4} value={local} onChange={e => setLocal(e.target.value)}
          onBlur={() => { setEditing(false); onChange(local); }} style={b} />
      : <input autoFocus type="text" value={local} onChange={e => setLocal(e.target.value)}
          onBlur={() => { setEditing(false); onChange(local); }} style={b} />;
  }
  return (
    <div className="no-print-edit" onClick={() => setEditing(true)}
      style={{ ...style, cursor: "pointer", borderRadius: 3, padding: "2px 4px", margin: "0 -4px", transition: "background 0.15s" }}
      onMouseEnter={e => { e.currentTarget.style.background = "rgba(255,253,231,0.6)"; }}
      onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}>
      {local || placeholder}
    </div>
  );
}

                              style={{ padding: "10px 14px", borderRadius: 8,
                                border: `1.5px solid ${a ? C.blue : C.grayBorder}`,
                                background: a ? C.blueBg : "#fff", cursor: "pointer",
                                display: "flex", justifyContent: "space-between", alignItems: "center",
                                fontFamily: "inherit", width: "100%" }}>
                              <div>
                                <span style={{ fontSize: 13, fontWeight: 600, color: a ? C.navy : C.dark }}>{opt.label}</span>
                                <span style={{ fontSize: 11, color: C.grayLight, marginLeft: 8 }}>({opt.hw})</span>
                              </div>
                              <div style={{ width: 20, height: 20, borderRadius: 5,
                                border: `2px solid ${a ? C.blue : "#D1D5DB"}`,
                                background: a ? C.blue : "#fff",
                                display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                {a && <Check size={12} color="#fff" />}
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {screen === 5 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {VALUE_DRIVERS.map(v => {
                    const Icon = v.icon;
                    const a = fd.valueDrivers.includes(v.label);
                    const dis = !a && fd.valueDrivers.length >= 2;
                    return (
                      <button key={v.id} onClick={() => !dis && toggleDriver(v.label)}
                        style={{ padding: "16px 18px", borderRadius: 10,
                          border: `2px solid ${a ? C.navy : C.grayBorder}`,
                          background: a ? C.navy : dis ? "#FAFAFA" : "#fff",
                          cursor: dis ? "not-allowed" : "pointer",
                          display: "flex", alignItems: "center", gap: 14,
                          fontFamily: "inherit", opacity: dis ? 0.4 : 1, width: "100%" }}>
                        <div style={{ width: 36, height: 36, borderRadius: 8,
                          background: a ? C.blue : C.blueBg,
                          display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          <Icon size={18} color={a ? "#fff" : C.blue} />
                        </div>
                        <div style={{ textAlign: "left", flex: 1 }}>
                          <span style={{ fontSize: 15, fontWeight: 700, color: a ? "#fff" : C.dark }}>{v.label}</span>
                          <p style={{ fontSize: 12, color: a ? "rgba(255,255,255,0.6)" : C.gray, margin: "2px 0 0" }}>{v.desc}</p>
                        </div>
                        {a && <Check size={16} color="#fff" />}
                      </button>
                    );
                  })}
                </div>
              )}
              {screen === 6 && (
                <textarea autoFocus value={fd.keyChallenge}
                  onChange={e => setFd({ ...fd, keyChallenge: e.target.value })}
                  placeholder="e.g. We need to reduce accident liability costs and can't locate our equipment"
                  style={{ width: "100%", padding: "16px 20px", borderRadius: 10,
                    border: `2px solid ${C.grayBorder}`, fontSize: 15, fontFamily: "inherit",
                    color: C.navy, height: 120, resize: "none", lineHeight: 1.6 }}
                  onFocus={e => e.target.style.borderColor = C.blue}
                  onBlur={e => e.target.style.borderColor = C.grayBorder} />
              )}
              {screen === 7 && (
                <div>
                  <div style={{ background: C.blueBg, borderRadius: 10, padding: "18px 22px", marginBottom: 16 }}>
                    <div style={{ display: "grid", gridTemplateColumns: "90px 1fr", gap: "8px 14px", fontSize: 13 }}>
                      <span style={{ fontWeight: 700, color: C.gray }}>Customer</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.customerName}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Industry</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.industry}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Fleet</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.fleetSize} vehicles</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Assets</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.assetSize} assets</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Products</span>
                      <span style={{ fontWeight: 600, color: C.navy, lineHeight: 1.5 }}>
                        {fd.products.map(id => {
                          const p = ALL_PRODUCTS.find(x => x.id === id);
                          return p ? p.label + " (" + p.hw + ")" : id;
                        }).join(", ")}
                      </span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Drivers</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.valueDrivers.join(", ")}</span>
                      <span style={{ fontWeight: 700, color: C.gray }}>Challenge</span>
                      <span style={{ fontWeight: 600, color: C.navy }}>{fd.keyChallenge}</span>
                    </div>
                  </div>
                  <p style={{ fontSize: 11, fontWeight: 700, color: C.navy, marginBottom: 10 }}>
                    Your Contact Info (appears on the snapshot)
                  </p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Name *
                      </label>
                      <input type="text" value={fd.adrName}
                        onChange={e => setFd({ ...fd, adrName: e.target.value })}
                        placeholder="Jane Smith"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Email *
                      </label>
                      <input type="email" value={fd.adrEmail}
                        onChange={e => setFd({ ...fd, adrEmail: e.target.value })}
                        placeholder="jane@samsara.com"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                    <div style={{ gridColumn: "1 / 3" }}>
                      <label style={{ fontSize: 11, fontWeight: 600, color: C.gray, display: "block", marginBottom: 4 }}>
                        Phone (optional)
                      </label>
                      <input type="tel" value={fd.adrPhone}
                        onChange={e => setFd({ ...fd, adrPhone: e.target.value })}
                        placeholder="(415) 555-0123"
                        style={{ width: "100%", padding: "10px 14px", borderRadius: 8,
                          border: "2px solid " + C.grayBorder, fontSize: 14, fontFamily: "inherit", color: C.navy }}
                        onFocus={e => e.target.style.borderColor = C.blue}
                        onBlur={e => e.target.style.borderColor = C.grayBorder} />
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
              marginTop: 28, paddingTop: 18, borderTop: `1px solid ${C.grayBorder}` }}>
              <button onClick={() => screen > 0 && nav(-1)} disabled={screen === 0}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "10px 18px",
                  borderRadius: 8, border: "none",
                  background: screen > 0 ? C.blueBg : "transparent",
                  color: screen > 0 ? C.navy : "transparent",
                  fontSize: 13, fontWeight: 600,
                  cursor: screen > 0 ? "pointer" : "default", fontFamily: "inherit" }}>
                <ChevronLeft size={15} /> Back
              </button>
              {screen < 7
                ? <button onClick={() => canAdvance() && nav(1)} disabled={!canAdvance()}
                    style={{ display: "flex", alignItems: "center", gap: 6,
                      padding: "12px 28px", borderRadius: 8, border: "none",
                      background: canAdvance() ? C.blue : "#CBD5E1", color: "#fff",
                      fontSize: 14, fontWeight: 700,
                      cursor: canAdvance() ? "pointer" : "not-allowed", fontFamily: "inherit" }}>
                    Continue <ChevronRight size={16} />
                  </button>
                : <button onClick={handleGenerate}
                    style={{ display: "flex", alignItems: "center", gap: 6,
                      padding: "13px 32px", borderRadius: 8, border: "none",
                      background: C.blue, color: "#fff", fontSize: 15, fontWeight: 700,
                      cursor: "pointer", fontFamily: "inherit" }}>
                    Generate Snapshot <ChevronRight size={17} />
                  </button>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ─── SNAPSHOT phase ──────────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100vh", background: "#C8CED6",
      fontFamily: "'Helvetica Neue',Helvetica,Arial,sans-serif" }}>
      <style>{`
        *{box-sizing:border-box;}
        @media print {
          .no-print, .no-print-edit > * { display: none !important; }
          body, html, #root { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          .snap { box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; width: 11in !important; height: 8.5in !important; }
          @page { size: 11in 8.5in landscape; margin: 0; }
        }
      `}</style>

      <div className="no-print" style={{ background: C.navy, padding: "10px 20px",
        display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACwAAAAsCAYAAAAehFoBAAAGOUlEQVR42u2Ya4xeVRWGn7X2Pt9Mp5cp1WpMRSnpdLBRWrwQKa0fl0SEHxZTJ0YFNaghGI0k1do/ZCTxEiVGm1QuCkkJYtBpoNgGvMTLDERUnNSUMC29GCcpNJh0sCPDfPOdvdfyx/laqEHsTGem/Jj31zk5++zz7ve8e102zGEOc5jDayFM31S9Sp3A8MUCQwK9Qp3Aeecpw8MA/jpZc68C+v/H9QRAzvRrZzhBT4C+DMDKdRdCvBpsDcgbEM+4PAc8gYdHOfi7Z19e4K12Fgi3yHatXYMW2wjFpdV0DtIS3K36hGXwfA9jE5s58qeRUxY6K4Tr9Uh/f6Jr/Y3E2p1Y+jPZthPkudaI5RjjKEcxCoR3IvplQCibH+Tvf/zrVEnLlJVdWb+JWNxOLm8g27OEeANu70I84T4IsghkFdAAHYDG/UjblxD5JFZexIHH907FHjIlst3196LxSdLEx4E3Edu2goMZiLQs0boH0ABmL2ATG9DaF8AvZ/TF8zk62GhFj9OOIDo5wquqic1/Qi7vR2hQtG8ll5DLjOWEZSM1M7nMeDYsJ3Lp4OcgtUdI+TaQGvPnfR0w6vUwQwq31F2xrk4s/gB5LeZ9hNoycvNfIIsrJZNXMvOy2paOg3QSa5Ca23F/GtFv0V47h72/GePkbp1Ohev/rEiofhpLe8i8hdi+jNS8A+QTeN6I5X40Cu4ZxIBRPF2H6nXgnyeXx3E2ojyFSMF447KWGDr9lujvbxnS3w/yF8Tfg2VH9bvgP0VrW3H7BmZHERE0KJZvJLOUomMXJvMx20qtfWF1nZ8H1p8ixjR7uCLsLAVGcOkkRMGsjsgmYtGJ6Icx6yO2Kbn8B7F4CtXvUDaeRPg1yDrcHXwhwgjIssnGKJ2810Vx7wAfw80RuRP3eZTj1+PehbK3srA8TkrvQ+Rh8sQmRL5JCFdgSUCbOB2I62QJxymkmoTTjbADd8G9Riy2kVMGH8f0h+QShD24dCPhI0jsaW1IAzLmIwRZhntjphR+Jf6NyDqEfeRyHBEnlwlcCMUCxJeQ0wHwwwiXgEfwTE5NNAjwBCrzKdojMDHThAW8QdG+AOciYBuxFnAcxyor+LsR+sAnwNdgmVYmEUQF5Ptgn5pqBTN5hZ1ALh3RW0jcR27uJxQFQsYNhDpB7sV0CRo7wTLuJUVbQZq4G3clFBvICWTy9fhULCG4CRrfTCE/INtG3A4Tam1YyrisYt/AQcTPRzThYhTtNdLEDkzuQPXuqoqbLYWriGHk5hE0XkEIt5HKDVh+AC0CRa1G1/qfA59FNKIKuXkLlr9HDL8AX4TbkRPJcKYJO0gb5s8jfI5cGhKuIRY78fQz8I2ktAPRaxFtI5Xb8HQ1+Cga+9GwDLO/YXoTouBiMx/W8Aaq5+LcByi5LNGwAq09RE6/RWUH4j8iaw211aDb0OICcunkZgZWI34PnkEmX97G01e2VaCINHAfA9sO+lVCLHCDXBohXonIlViu/p0WVbeRmpkQAxDIaRjxHYhuwnlh5ixxogx0f6biLiNVMsgDuB1u1Q5glnDvx/Iwlgx30BDI6fe4DaNqIKPVbrCnZyGsycOEuBAJ3271bo8AQ4g0wQ+hIYLvRPQAohnsEBpAZDeW96NhORpuJTUnSD5wamE1vR1HNbZ77QIsPoPoUrAAIqhCSvtANxNkV1VjqGB5P/AVNOzG/URjmghFwNKDHBj4KD09gb7T7+0mF7h7egIDv2rwxrcdJ8RrETEsb8FtnBgvxfNVhKIDs5txD4R4MW4fIhQd5HwzuBOKLjyXOB9jZPgYQz1Av88M4aEhh57AsUcHWfLWC4htF5JTRLUbGMP5MaJ1sA5EVoK/iPtdiNbx3A6yghiXkNMXOfjYL6su5nab4cTRZ9Cr2PzPUI4/SG3e5Y           <span style={{ fontSize: 13, fontWeight: 600, color: "rgba(255,255,255,0.7)" }}>
            Value Snapshot Generator
          </span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setPhase("intake"); setScreen(0); }}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 14px",
              borderRadius: 6, border: "1px solid rgba(255,255,255,0.2)",
              background: "transparent", color: "rgba(255,255,255,0.75)",
              fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
            <RotateCcw size={12} /> New Snapshot
          </button>
          <button onClick={() => window.print()}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 18px",
              borderRadius: 6, border: "none", background: C.blue, color: "#fff",
              fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
            <Download size={12} /> Download PDF
          </button>
        </div>
      </div>
      <div className="no-print" style={{ maxWidth: 1100, margin: "6px auto 4px",
        padding: "0 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <p style={{ fontSize: 11, color: C.gray, fontStyle: "italic", margin: 0 }}>
          Click text to edit · Hover sections to remove · Numbers are locked
        </p>
        {Object.keys(hidden).length > 0 && (
          <button onClick={() => setHidden({})}
            style={{ fontSize: 10, color: C.blue, background: "none", border: "none",
              cursor: "pointer", fontWeight: 700, fontFamily: "inherit" }}>
            Restore all
          </button>
        )}
      </div>

      <SnapshotPage
        fd={fd}
        snapshot={snapshot}
        hidden={hidden}
        desel={desel}
        editNarr={editNarr} setEditNarr={setEditNarr}
        editCtx={editCtx} setEditCtx={setEditCtx}
        editCTA={editCTA} setEditCTA={setEditCTA}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
