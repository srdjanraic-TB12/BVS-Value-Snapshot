function generateNarrative(fd){
  const dk=fd.valueDrivers[0]==="Reduce Risk"?"risk":fd.valueDrivers[0]==="Increase Efficiency"?"efficiency":"transform";
  const n=fd.customerName,s=fd.fleetSize,ha=fd.assetSize>0,p=fd.products;
  const assetRef=ha?` and ${fd.assetSize} assets`:"";
  let base="";let covered=[];
  if(dk==="risk"){
    if(p.includes("cm34_aim4")){base=`For ${n}, Samsara can cut accident frequency, liability claims, and insurance exposure across the ${s}-vehicle fleet${assetRef}. AI dual-facing cameras with 360° coverage flag risky behaviors in real time and capture exoneration footage when incidents do occur.`;covered=["accident_liability","driver_behavior"];}
    else if(p.includes("cm34")){base=`For ${n}, Samsara can lower preventable accidents and reduce liability costs across the ${s}-vehicle fleet${assetRef}. AI dual-facing cameras coach drivers in the moment and provide video evidence that protects against false claims.`;covered=["accident_liability","driver_behavior"];}
    else if(p.includes("cm33")){base=`For ${n}, Samsara can reduce at-fault crashes and accelerate claim resolution across the ${s}-vehicle fleet. Forward-facing AI cameras detect collision risk early and supply exoneration footage when an incident occurs.`;covered=["accident_liability"];}
    else if(p.includes("vg")){base=`For ${n}, Samsara can lower speeding incidents and harsh-event rates across the ${s}-vehicle fleet. Real-time GPS and telemetry surface the riskiest drivers so supervisors can coach where it matters most.`;covered=["driver_behavior"];}
    else{base=`For ${n}, Samsara turns operational data into early warnings across the ${s}-vehicle fleet${assetRef} so risk gets addressed before it becomes a claim.`;covered=["accident_liability"];}
  }else if(dk==="efficiency"){
    if(p.includes("vg")){base=`For ${n}, Samsara can recover fuel and labor costs lost to idling, off-route driving, and unplanned breakdowns. Real-time GPS and engine telemetry expose where the ${s}-vehicle fleet is losing time and money every day.`;covered=["fuel_waste"];}
    else if(p.includes("ag53")||p.includes("ag52")){base=`For ${n}, Samsara can raise equipment utilization and shrink time wasted hunting for assets${ha?` across ${fd.assetSize} pieces of equipment`:""}. Connected monitoring shows where every asset is, how hard it's working, and when it needs service before it fails.`;covered=["asset_visibility","maintenance_reactive"];}
    else if(p.includes("cam")){base=`For ${n}, Samsara can shorten work-order cycles and reduce unplanned downtime across the ${s}-vehicle fleet${assetRef}. A single maintenance platform replaces paper and disconnected systems so issues get caught and closed faster.`;covered=["maintenance_reactive","manual_processes"];}
    else{base=`For ${n}, Samsara surfaces fuel, utilization, and uptime gaps across the ${s}-vehicle fleet${assetRef} so small fixes compound into measurable annual savings.`;covered=["fuel_waste"];}
  }else{
    if(p.includes("workflows")||p.includes("training")){base=`For ${n}, Samsara can free supervisors from paperwork and give leadership a real-time view of field operations across the ${s}-vehicle fleet${assetRef}. Digital inspections, training, and reporting replace clipboards and spreadsheets without changing how crews work.`;covered=["manual_processes","compliance_burden","training_gaps"];}
    else if(p.includes("cam")){base=`For ${n}, Samsara can run maintenance as a connected workflow instead of a paper trail. One platform handles fault detection, work orders, and cost tracking so techs spend less time logging and more time fixing.`;covered=["maintenance_reactive","manual_processes"];}
    else{base=`For ${n}, Samsara digitizes the workflows the ${s}-vehicle fleet${assetRef} runs on today, giving every stakeholder the same live data from a single platform.`;covered=["manual_processes"];}
  }
  const themes=detectThemes(fd.keyChallenge);
  if(themes.length>0){const newThemes=themes.filter(t=>!covered.includes(t)).slice(0,2);const fr=newThemes.map(t=>THEME_FRAGMENTS[t]).filter(Boolean);if(fr.length===1)base+=` Beyond this, Samsara also helps ${n} ${fr[0]}.`;else if(fr.length>=2)base+=` Beyond this, Samsara also helps ${n} ${fr[0]} — and ${fr[1]}.`;}
  if(fd.valueDrivers.length>1){const sec=fd.valueDrivers[1];if(sec==="Reduce Risk")base+=` The same platform extends to safety outcomes, protecting the workforce on the same data feed.`;else if(sec==="Increase Efficiency")base+=` That same data compounds into measurable efficiency gains across the fleet.`;else base+=` The workflows that run on top consolidate paper processes into one digital backbone.`;}
  return base;
}

function generateSnapshot(fd){
  const selected=fd.products.map(id=>ALL_PRODUCTS.find(p=>p.id===id)).filter(Boolean);
  let tA=0,tS=0;
  selected.forEach(p=>{const m=p.appliesTo==="fleet"?fd.fleetSize:p.appliesTo==="asset"?fd.assetSize:fd.fleetSize+fd.assetSize;tA+=p.avoidCost*m;tS+=p.savings*m;});
  const dk=fd.valueDrivers[0]==="Reduce Risk"?"risk":fd.valueDrivers[0]==="Increase Efficiency"?"efficiency":"transform";
  const eq=EQUIVALENCY[dk];const eqNum=Math.round(tS/eq.divisor);const eqText=eqNum>=2?"Equivalent to ~"+eqNum+" "+eq.label:"";
  return{totalAvoidable:roundTo5K(tA),totalSavings:roundTo5K(tS),narrative:generateNarrative(fd),benchmarks:BENCHMARKS[dk][fd.products[0]]||BENCHMARKS[dk].default,caseStudy:CASE_STUDIES[fd.industry][dk],industryContext:getContext(fd.industry,fd.customerName),custLabels:selected.map(p=>p.custLabel),equivalency:eqText};
}

function EditableText({value,onChange,multiline=false,style={}}){
  const[editing,setEditing]=useState(false);const[local,setLocal]=useState(value);
  useEffect(()=>setLocal(value),[value]);
  if(editing){const b={...style,background:"#FFFDE7",border:`2px solid ${C.amber}`,borderRadius:4,padding:"4px 8px",outline:"none",width:"100%",fontFamily:"inherit",fontSize:"inherit",color:"inherit",lineHeight:"inherit",boxSizing:"border-box",resize:"none"};

  }

    onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,253,231,0.5)";}} onMouseLeave={e=>{e.currentTarget.style.background="transparent";}}>

  </div>);
}

              {screen===5&&<div style={{display:"flex",flexDirection:"column",gap:8}}>{VALUE_DRIVERS.map(v=>{const Icon=v.icon;const a=fd.valueDrivers.includes(v.label);const dis=!a&&fd.valueDrivers.length>=2;return(<button key={v.id} onClick={()=>!dis&&toggleDriver(v.label)} style={{padding:"16px 18px",borderRadius:10,border:`2px solid ${a?C.navy:C.grayBorder}`,background:a?C.navy:dis?"#FAFAFA":C.white,cursor:dis?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:14,fontFamily:"inherit",opacity:dis?0.4:1,width:"100%"}}><div style={{width:36,height:36,borderRadius:8,background:a?C.blue:C.blueBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon size={18} color={a?C.white:C.blue}/></div><div style={{textAlign:"left",flex:1}}><span style={{fontSize:15,fontWeight:700,color:a?C.white:C.dark}}>{v.label}</span><p style={{fontSize:12,color:a?"rgba(255,255,255,0.6)":C.gray,margin:"2px 0 0"}}>{v.desc}</p></div>{a&&<Check size={16} color={C.white}/>}</button>);})}</div>}
              {screen===6&&<textarea autoFocus value={fd.keyChallenge} onChange={e=>setFd({...fd,keyChallenge:e.target.value})} placeholder="e.g. We need to reduce accident liability costs and can't locate our equipment" style={{width:"100%",padding:"16px 20px",borderRadius:10,border:`2px solid ${C.grayBorder}`,fontSize:15,fontFamily:"inherit",color:C.navy,height:120,resize:"none",lineHeight:1.6}} onFocus={e=>e.target.style.borderColor=C.blue} onBlur={e=>e.target.style.borderColor=C.grayBorder}/>}
              {screen===7&&<div><div style={{background:C.blueBg,borderRadius:10,padding:"18px 22px",marginBottom:16}}><div style={{display:"grid",gridTemplateColumns:"90px 1fr",gap:"8px 14px",fontSize:13}}><span style={{fontWeight:700,color:C.gray}}>Customer</span><span style={{fontWeight:600,color:C.navy}}>{fd.customerName}</span><span style={{fontWeight:700,color:C.gray}}>Industry</span><span style={{fontWeight:600,color:C.navy}}>{fd.industry}</span><span style={{fontWeight:700,color:C.gray}}>Fleet</span><span style={{fontWeight:600,color:C.navy}}>{fd.fleetSize} vehicles</span><span style={{fontWeight:700,color:C.gray}}>Assets</span><span style={{fontWeight:600,color:C.navy}}>{fd.assetSize} assets</span><span style={{fontWeight:700,color:C.gray}}>Products</span><span style={{fontWeight:600,color:C.navy,lineHeight:1.5}}>{fd.products.map(id=>{const p=ALL_PRODUCTS.find(x=>x.id===id);return p?p.label+" ("+p.hw+")":id;}).join(", ")}</span><span style={{fontWeight:700,color:C.gray}}>Drivers</span><span style={{fontWeight:600,color:C.navy}}>{fd.valueDrivers.join(", ")}</span><span style={{fontWeight:700,color:C.gray}}>Challenge</span><span style={{fontWeight:600,color:C.navy}}>{fd.keyChallenge}</span></div></div><p style={{fontSize:11,fontWeight:700,color:C.navy,marginBottom:10}}>Your Contact Info (appears on the snapshot)</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><div><label style={{fontSize:11,fontWeight:600,color:C.gray,display:"block",marginBottom:4}}>Name *</label><input type="text" value={fd.adrName} onChange={e=>setFd({...fd,adrName:e.target.value})} placeholder="Jane Smith" style={{width:"100%",padding:"10px 14px",borderRadius:8,border:"2px solid "+C.grayBorder,fontSize:14,fontFamily:"inherit",color:C.navy}} onFocus={e=>e.target.style.borderColor=C.blue} onBlur={e=>e.target.style.borderColor=C.grayBorder}/></div><div><label style={{fontSize:11,fontWeight:600,color:C.gray,display:"block",marginBottom:4}}>Email *</label><input type="email" value={fd.adrEmail} onChange={e=>setFd({...fd,adrEmail:e.target.value})} placeholder="jane@samsara.com" style={{width:"100%",padding:"10px 14px",borderRadius:8,border:"2px solid "+C.grayBorder,fontSize:14,fontFamily:"inherit",color:C.navy}} onFocus={e=>e.target.style.borderColor=C.blue} onBlur={e=>e.target.style.borderColor=C.grayBorder}/></div></div><div style={{marginTop:10}}><label style={{fontSize:11,fontWeight:600,color:C.gray,display:"block",marginBottom:4}}>Phone (optional)</label><input type="tel" value={fd.adrPhone} onChange={e=>setFd({...fd,adrPhone:e.target.value})} placeholder="(555) 123-4567" style={{width:"50%",padding:"10px 14px",borderRadius:8,border:"2px solid "+C.grayBorder,fontSize:14,fontFamily:"inherit",color:C.navy}} onFocus={e=>e.target.style.borderColor=C.blue} onBlur={e=>e.target.style.borderColor=C.grayBorder}/></div></div>}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:28,paddingTop:18,borderTop:`1px solid ${C.grayBorder}`}}>
              <button onClick={()=>screen>0&&nav(-1)} disabled={screen===0} style={{display:"flex",alignItems:"center",gap:5,padding:"10px 18px",borderRadius:8,border:"none",background:screen>0?C.blueBg:"transparent",color:screen>0?C.navy:"transparent",fontSize:13,fontWeight:600,cursor:screen>0?"pointer":"default",fontFamily:"inherit"}}><ChevronLeft size={15}/> Back</button>
              {screen<7?<button onClick={()=>canAdvance()&&nav(1)} disabled={!canAdvance()} style={{display:"flex",alignItems:"center",gap:6,padding:"12px 28px",borderRadius:8,border:"none",background:canAdvance()?C.blue:"#CBD5E1",color:C.white,fontSize:14,fontWeight:700,cursor:canAdvance()?"pointer":"not-allowed",fontFamily:"inherit"}}>Continue <ChevronRight size={16}/></button>
              :<button onClick={handleGenerate} style={{display:"flex",alignItems:"center",gap:6,padding:"13px 32px",borderRadius:8,border:"none",background:C.blue,color:C.white,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Generate Snapshot <ChevronRight size={17}/></button>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ──── SNAPSHOT (Matching PPT mockup layout exactly) ────
  const s=snapshot;

  return(
    <div style={{minHeight:"100vh",background:"#C8CED6",fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif"}}>
      <style>{`*{box-sizing:border-box;}@media print{.no-print{display:none!important;}body,html{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}.snap{box-shadow:none!important;margin:0!important;border-radius:0!important;width:11in!important;height:8.5in!important;padding:0.35in 0.45in!important;}@page{size:11in 8.5in landscape;margin:0;}}`}</style>

      <div className="no-print" style={{background:C.navy,padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><img src={SAMSARA_LOGO_WHITE} alt="Samsara" style={{width:18,height:18}}/><span style={{fontSize:13,fontWeight:600,color:"rgba(255,255,255,0.7)"}}>Value Snapshot Generator</span></div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{setPhase("intake");setScreen(0);}} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 14px",borderRadius:6,border:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"rgba(255,255,255,0.75)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}><RotateCcw size={12}/> New Snapshot</button>
          <button onClick={()=>{const t=document.title;document.title=fd.customerName.replace(/\s+/g,'_')+'_Samsara Value Snapshot';window.print();document.title=t;}} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 18px",borderRadius:6,border:"none",background:C.blue,color:C.white,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}><Download size={12}/> Download PDF</button>
        </div>
      </div>
      <div className="no-print" style={{maxWidth:1100,margin:"6px auto 4px",padding:"0 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <p style={{fontSize:11,color:C.gray,fontStyle:"italic",margin:0}}>Click text to edit · Hover sections to remove · Numbers are locked</p>
        {Object.keys(hidden).length>0&&<button onClick={()=>setHidden({})} style={{fontSize:10,color:C.blue,background:"none",border:"none",cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>Restore all</button>}
      </div>

      {/* ════════ SNAPSHOT PAGE — CSS GRID LAYOUT ════════ */}
      <div className="snap" style={{width:1076,aspectRatio:"11/8.5",margin:"2px auto 24px",background:C.white,borderRadius:3,boxShadow:"0 4px 28px rgba(0,0,0,0.12)",padding:"28px 36px",display:"grid",gridTemplateRows:"auto auto auto 9fr 11fr auto",gap:0,overflow:"hidden"}}>

        {/* ROW 0: HEADER */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><img src={SAMSARA_LOGO_DARK} alt="Samsara" style={{width:24,height:24}}/><span style={{fontSize:14,fontWeight:700,color:C.navy,letterSpacing:-0.3}}>Samsara</span></div>
            <span style={{fontSize:17,fontWeight:700,color:C.navy}}>Value Snapshot</span>
            <span style={{fontSize:9,color:C.grayLight,fontWeight:500,marginLeft:4}}>{dateStamp}</span>
          </div>
          <div style={{textAlign:"right"}}><p style={{fontSize:8,fontWeight:600,color:C.grayLight,textTransform:"uppercase",letterSpacing:2,margin:"0 0 1px 0"}}>Prepared For</p><p style={{fontSize:15,fontWeight:700,color:C.navy,margin:0}}>{fd.customerName}</p><p style={{fontSize:10,fontWeight:600,color:C.gray,margin:"2px 0 0 0"}}>{fd.industry}</p><p style={{fontSize:9,color:C.grayLight,margin:"2px 0 0 0"}}>{fd.fleetSize}-vehicle fleet{fd.assetSize>0?` · ${fd.assetSize} assets`:""}</p></div>
        </div>

        {/* ROW 1: DIVIDER */}
        <div style={{height:3,background:`linear-gradient(90deg,${C.blue},${C.blueLight})`,borderRadius:99,marginBottom:8}}/>

        {/* ROW 2: OVERVIEW — auto height, no stretching */}
        {!hidden.ctx && (
          <div style={{position:"relative",marginBottom:8}} onMouseEnter={e=>{const b=e.currentTarget.querySelector('.ds');if(b)b.style.opacity=1;}} onMouseLeave={e=>{const b=e.currentTarget.querySelector('.ds');if(b)b.style.opacity=0;}}>
            <button className="ds no-print" onClick={()=>desel("ctx","removed")} style={{position:"absolute",top:4,right:4,zIndex:10,opacity:0,width:18,height:18,borderRadius:99,background:C.redBg,border:`1px solid ${C.red}30`,color:C.red,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0,transition:"opacity 0.15s"}}><X size={9}/></button>
            <div style={{background:C.blueBg,padding:"8px 14px",borderRadius:5,borderLeft:`4px solid ${C.blue}`}}>
              <EditableText value={editCtx} onChange={setEditCtx} multiline style={{fontSize:10,color:C.dark,lineHeight:1.55,fontStyle:"italic"}}/>
            </div>
          </div>
        )}
        {hidden.ctx && <div/>}

        {/* ROW 3 (1fr): Narrative | Avoidable | Savings */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8,minHeight:0}}>
          {/* LEFT: Narrative */}
          {!hidden.narr ? (
            <div style={{position:"relative",minHeight:0}} onMouseEnter={e=>{const b=e.currentTarget.querySelector('.ds');if(b)b.style.opacity=1;}} onMouseLeave={e=>{const b=e.currentTarget.querySelector('.ds');if(b)b.style.opacity=0;}}>
              <button className="ds no-print" onClick={()=>desel("narr","removed")} style={{position:"absolute",top:4,right:4,zIndex:10,opacity:0,width:18,height:18,borderRadius:99,background:C.redBg,border:`1px solid ${C.red}30`,color:C.red,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0,transition:"opacity 0.15s"}}><X size={9}/></button>
              <div style={{background:C.blueBg,padding:"14px 16px",borderRadius:8,height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"}}>
                <h3 style={{fontSize:8.5,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:2,margin:"0 0 8px 0",flexShrink:0,display:"flex",alignItems:"center",gap:6}}><Shield size={11} color={C.blue}/>How Samsara Can Help You</h3>
                <div style={{fontSize:10.5,color:C.dark,lineHeight:1.65,overflow:"hidden"}}><EditableText value={editNarr} onChange={setEditNarr} multiline style={{fontSize:10.5,color:C.dark,lineHeight:1.65}}/></div>
                <div style={{marginTop:"auto",paddingTop:10,borderTop:`1px solid ${C.blue}20`,flexShrink:0}}>
                  <p style={{fontSize:7.5,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 6px 0"}}>Solution Scope</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"4px 12px"}}>
                    {s.custLabels.map((label,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
                        <div style={{width:4,height:4,background:C.blue,borderRadius:99,flexShrink:0}}/>
                        <span style={{fontSize:9,color:C.dark,fontWeight:500}}>{label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          ) : <div/>}

          {/* RIGHT: Two financial cards */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,minHeight:0}}>
            {!hidden.avoid ? (
              <div style={{background:C.redBg,borderRadius:8,padding:"14px 16px",display:"flex",flexDirection:"column",justifyContent:"center",minHeight:0}}>
                <p style={{fontSize:7.5,fontWeight:700,color:C.red,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 6px 0",minHeight:24,lineHeight:1.4}}>Estimated Avoidable Costs Today</p>
                <p style={{fontSize:28,fontWeight:700,color:C.red,margin:"0 0 10px 0",letterSpacing:-0.5,lineHeight:1}}>~${s.totalAvoidable.toLocaleString()}</p>
                <p style={{fontSize:7.5,color:C.red+"70",margin:"auto 0 0 0"}}>{fd.fleetSize} vehicles{fd.assetSize>0?" · "+fd.assetSize+" assets":""}</p>
              </div>
            ) : <div/>}
            {!hidden.savings ? (
              <div style={{background:C.greenBg,borderRadius:8,padding:"14px 16px",display:"flex",flexDirection:"column",justifyContent:"center",minHeight:0}}>
                <p style={{fontSize:7.5,fontWeight:700,color:C.green,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 6px 0",minHeight:24,lineHeight:1.4}}>Estimated Annual Savings with Samsara</p>
                <p style={{fontSize:28,fontWeight:700,color:C.green,margin:"0 0 6px 0",letterSpacing:-0.5,lineHeight:1}}>~${s.totalSavings.toLocaleString()}</p>
                {s.equivalency&&<p style={{fontSize:8.5,fontWeight:600,color:C.green,margin:"0 0 6px 0",fontStyle:"italic"}}>{s.equivalency}</p>}
                <p style={{fontSize:7.5,color:C.green+"70",margin:"auto 0 0 0"}}>{fd.fleetSize} vehicles{fd.assetSize>0?" · "+fd.assetSize+" assets":""}</p>
              </div>
            ) : <div/>}
          </div>
        </div>

        {/* ROW 4 (1fr): Benchmarks | Case Study + Next Steps */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,minHeight:0}}>
          {/* LEFT: Benchmarks */}
          {!hidden.bench ? (
            <div style={{display:"flex",flexDirection:"column",minHeight:0,overflow:"hidden"}}>
              <h3 style={{fontSize:8.5,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:2,margin:"0 0 8px 0",flexShrink:0,display:"flex",alignItems:"center",gap:6}}><BarChart3 size={11} color={C.blue}/>How Samsara Customers Perform</h3>
              <div style={{display:"flex",flexDirection:"column",gap:8,flex:1,overflow:"hidden"}}>
                {s.benchmarks.map((b,i)=><BenchBar key={i} data={b}/>)}
              </div>
            </div>
          ) : <div/>}

          {/* RIGHT: Case Study + Next Steps stacked */}
          <div style={{display:"grid",gridTemplateRows:"1fr 1fr",gap:8,minHeight:0}}>
            {!hidden.case ? (
              <div style={{background:C.navy,color:C.white,padding:"14px 16px",borderRadius:8,display:"flex",flexDirection:"column",justifyContent:"center",overflow:"hidden",minHeight:0}}>
                <h3 style={{fontSize:8.5,fontWeight:700,opacity:0.5,textTransform:"uppercase",letterSpacing:2,margin:"0 0 8px 0",display:"flex",alignItems:"center",gap:6}}><BookOpen size={11}/>Case Study Spotlight</h3>
                <p style={{fontSize:12,fontWeight:700,margin:"0 0 3px 0"}}>{s.caseStudy.customer}</p>
                <p style={{fontSize:12,fontWeight:700,color:C.blueLight,margin:"0 0 6px 0"}}>{s.caseStudy.stat}</p>
                {s.caseStudy.quote?<p style={{fontSize:10,fontStyle:"italic",opacity:0.75,lineHeight:1.5,margin:0}}>"{s.caseStudy.quote}"</p>:<p style={{fontSize:9,opacity:0.5,margin:0}}>Results verified from published Samsara case study</p>}
              </div>
            ) : <div/>}
            {!hidden.cta ? (
              <div style={{background:C.blueBg,border:`1.5px solid ${C.blue}25`,borderRadius:8,padding:"14px 16px",display:"flex",flexDirection:"column",justifyContent:"center",overflow:"hidden",minHeight:0}}>
                <h3 style={{fontSize:8.5,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:2,margin:"0 0 6px 0",display:"flex",alignItems:"center",gap:6}}><ArrowRight size={11} color={C.blue}/>Next Steps</h3>
                <EditableText value={editCTA} onChange={setEditCTA} multiline style={{fontSize:10,color:C.dark,lineHeight:1.55}}/>
                {fd.adrName&&<div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${C.blue}20`,display:"flex",alignItems:"center",gap:8}}>
                  <Phone size={10} color={C.blue}/>
                  <div><p style={{fontSize:9,fontWeight:700,color:C.navy,margin:0}}>{fd.adrName}</p><p style={{fontSize:8.5,color:C.gray,margin:0}}>{fd.adrEmail}{fd.adrPhone?" · "+fd.adrPhone:""}</p></div>
                </div>}
              </div>
            ) : <div/>}
          </div>
        </div>

        {/* ROW 5: FOOTER */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:`1px solid ${C.grayBorder}`,paddingTop:8,marginTop:8}}>
          <p style={{fontSize:7,fontWeight:500,color:C.grayLight,margin:0}}>Based on Samsara platform data across similar fleet profiles. Individual results may vary.</p>
          <div style={{display:"flex",alignItems:"center",gap:5}}><img src={SAMSARA_LOGO_DARK} alt="Samsara" style={{width:14,height:14}}/><span style={{fontSize:9,fontWeight:700,color:C.navy,letterSpacing:1}}>SAMSARA</span></div>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
